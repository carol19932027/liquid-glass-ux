name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-glass:
    name: Glass library protection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      GUARD_HEAD_REF: ${{ github.sha }}
      GUARD_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      GUARD_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce src/glass protection
        run: bash scripts/guard-glass.sh

  verify:
    needs: guard-glass
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build
