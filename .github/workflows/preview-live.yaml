name: Live Preview Server (Vite HMR)

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to keep the live preview server & branch sync active"
        required: false
        default: "30"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-live-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-preview:
    name: Vite HMR Live Server
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PREVIEW_MINUTES: ${{ inputs.duration_minutes || '20' }}
      SYNC_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and build verification
        run: npm run build

      - name: Install Cloudflare Quick Tunnel (cloudflared)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Vite HMR live server, publish preview URL & sync branch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_TUNNEL: "1"
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          # 1. Launch Vite dev server with HMR enabled on 0.0.0.0:5173
          nohup npm run dev > /tmp/vite.log 2>&1 &
          VITE_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "Vite dev server ready on port 5173 (PID $VITE_PID)"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ > /dev/null

          # 2. Open Cloudflare HTTPS tunnel (forwards HTTP + WebSocket HMR over WSS/443)
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:5173 > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!

          TUNNEL_URL=""
          for i in $(seq 1 45); do
            TUNNEL_URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Failed to obtain Cloudflare Quick Tunnel URL"
            cat /tmp/cloudflared.log || true
            exit 1
          fi

          echo "::notice title=Vite Live Preview (HMR)::${TUNNEL_URL}"

          # Publish the URL *while the job is still running* so it is discoverable
          # immediately (step summaries and annotations only appear after completion):
          # a commit comment on HEAD, plus a PR comment when an open PR exists.
          COMMIT_COMMENT_BODY="**Vite HMR live preview:** ${TUNNEL_URL} (branch \`${SYNC_BRANCH}\`, active for ${PREVIEW_MINUTES} minutes) — run ${GITHUB_RUN_ID}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$COMMIT_COMMENT_BODY" > /dev/null 2>&1 || \
            echo "::warning::Could not post commit comment with the preview URL (check contents: write permission)"

          # Write GitHub Actions Job Summary
          {
            echo "## Vite Live Preview Server (HMR Enabled)"
            echo ""
            echo "- **Live URL:** [${TUNNEL_URL}](${TUNNEL_URL})"
            echo "- **Synced Branch:** \`${SYNC_BRANCH}\`"
            echo "- **Active Duration:** ${PREVIEW_MINUTES} minutes"
            echo "- **Hot Module Replacement:** Enabled over WSS (\`clientPort: 443\`)"
            echo ""
            echo "Pushing new commits to \`${SYNC_BRANCH}\` while this job is active automatically syncs the runner workspace and triggers Vite HMR in connected browsers."
          } >> "$GITHUB_STEP_SUMMARY"

          # Comment on PR if triggered from or associated with an open PR
          TARGET_PR="$PR_NUMBER"
          if [ -z "$TARGET_PR" ]; then
            TARGET_PR=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          fi
          if [ -n "$TARGET_PR" ]; then
            BODY="<!-- vite-hmr-live-preview -->
          ### Vite Live Preview (HMR Active)
          - **Live URL:** ${TUNNEL_URL}
          - **Synced Branch:** \`${SYNC_BRANCH}\`
          - **Run:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          _Workspace polls \`origin/${SYNC_BRANCH}\` every 5s and hot-reloads changes via Vite HMR for ${PREVIEW_MINUTES} minutes._"
            EXISTING_COMMENT=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
              --jq '.[] | select(.body | contains("<!-- vite-hmr-live-preview -->")) | .id' | head -n 1 || true)
            if [ -n "$EXISTING_COMMENT" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT}" -f body="$BODY" > /dev/null || true
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$BODY" > /dev/null || true
            fi
          fi

          # 3. Continuous workspace sync loop: polls remote branch and applies updates in-place for HMR
          END_TIME=$(( $(date +%s) + PREVIEW_MINUTES * 60 ))
          CURRENT_SHA=$(git rev-parse HEAD)
          echo "Live preview running at ${TUNNEL_URL} (tracking origin/${SYNC_BRANCH} @ ${CURRENT_SHA})"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            if ! kill -0 "$VITE_PID" 2>/dev/null; then
              echo "Vite process exited; restarting..."
              nohup npm run dev >> /tmp/vite.log 2>&1 &
              VITE_PID=$!
            fi

            if git fetch --quiet origin "$SYNC_BRANCH" 2>/dev/null; then
              REMOTE_SHA=$(git rev-parse FETCH_HEAD)
              if [ "$REMOTE_SHA" != "$CURRENT_SHA" ]; then
                echo "Detected workspace update on ${SYNC_BRANCH}: ${CURRENT_SHA} -> ${REMOTE_SHA}"
                CHANGED_FILES=$(git diff --name-only "$CURRENT_SHA" "$REMOTE_SHA" || true)
                git reset --hard "$REMOTE_SHA"
                if echo "$CHANGED_FILES" | grep -Eq '(^|/)package(-lock)?\.json$'; then
                  echo "Dependencies changed; running npm ci..."
                  npm ci --no-audit --no-fund
                fi
                CURRENT_SHA="$REMOTE_SHA"
                echo "Workspace synced to ${CURRENT_SHA}; Vite HMR notified."
              fi
            fi

            sleep 5
          done

          echo "Preview window (${PREVIEW_MINUTES}m) finished; shutting down."
          kill "$CF_PID" "$VITE_PID" 2>/dev/null || true
