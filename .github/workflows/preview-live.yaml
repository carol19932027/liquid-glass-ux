name: Live Preview Server (Vite HMR)

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to keep the live preview server & branch sync active"
        required: false
        default: "60"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-live-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-preview:
    name: Vite HMR Live Server
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PREVIEW_MINUTES: ${{ inputs.duration_minutes || '60' }}
      SYNC_BRANCH: ${{ github.head_ref || github.ref_name }}
      PORT: "5173"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and build verification
        run: npm run build

      - name: Install Cloudflare Quick Tunnel (cloudflared)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      # Starts Vite (HMR over WSS), exposes it through the first tunnel provider
      # that verifies healthy (cloudflared -> pinggy -> localhost.run), publishes
      # the verified URL to the commit / PR / job summary, then keeps the runner
      # workspace synced with origin/<branch> for PREVIEW_MINUTES.
      # On failure it posts full diagnostics (DNS, curl -v, provider + vite logs)
      # as a commit comment, since runner logs are not readable from every client.
      # The script is copied out of the working tree first: the sync loop runs
      # `git reset --hard` on new commits, and bash reads a running script
      # incrementally, so executing it in place could corrupt the live session.
      - name: Run Vite HMR live server & sync branch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          cp scripts/live-preview-server.sh /tmp/live-preview-server.sh
          bash /tmp/live-preview-server.sh
